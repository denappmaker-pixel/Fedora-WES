<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fedora WES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fedora-dark:#0b1e3d;
    --fedora-mid:#13294f;
    --fedora-blue:#3c6eb4;
    --fedora-light:#60b3e4;
    --accent:#8fd3ff;
    --surface: rgba(20,34,58,0.55);
    --surface-solid:#182b46;
    --border: rgba(255,255,255,0.12);
    --text:#eaf2fb;
    --text-dim:#9fb3cc;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    font-family:'Inter',sans-serif; color:var(--text); user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  #desktop{
    position:relative; width:100vw; height:100vh; overflow:hidden;
    background:linear-gradient(180deg,#040b1a 0%, #0b1e3d 38%, #13294f 62%, #1c3a63 100%);
  }

  /* ---------- Beautiful animated background ---------- */
  #bgLayer{position:absolute; inset:0; z-index:0; overflow:hidden;}
  .aurora{
    position:absolute; border-radius:50%; filter:blur(70px); opacity:.55; mix-blend-mode:screen;
    animation:drift 26s ease-in-out infinite;
  }
  .aurora.a1{width:60vw; height:60vw; background:radial-gradient(circle, #3c6eb4, transparent 70%); top:-20%; left:-15%; animation-duration:32s;}
  .aurora.a2{width:50vw; height:50vw; background:radial-gradient(circle, #60b3e4, transparent 70%); bottom:-25%; right:-10%; animation-duration:28s; animation-delay:-6s;}
  .aurora.a3{width:38vw; height:38vw; background:radial-gradient(circle, #8fd3ff, transparent 70%); top:20%; right:15%; animation-duration:22s; animation-delay:-11s; opacity:.35;}
  @keyframes drift{
    0%{transform:translate(0,0) scale(1);}
    50%{transform:translate(4%,-6%) scale(1.12);}
    100%{transform:translate(0,0) scale(1);}
  }
  #stars{position:absolute; inset:0;}
  .star{position:absolute; background:#fff; border-radius:50%; animation:twinkle linear infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:1;}}

  .mountains{position:absolute; left:0; right:0; bottom:0; width:100%;}
  .mountains svg{display:block; width:100%; height:auto;}
  .m-back{opacity:.35; transform:translateY(2%);}
  .m-mid{opacity:.55;}
  .m-front{opacity:.9;}

  .moon{
    position:absolute; top:8%; right:12%; width:90px; height:90px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff, #cfe6ff 55%, #8fd3ff 100%);
    box-shadow:0 0 60px 18px rgba(143,211,255,0.45);
  }

  /* ---------- Top bar ---------- */
  #topbar{
    position:absolute; top:0; left:0; right:0; height:34px; z-index:500;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 14px; background:rgba(6,14,28,0.55); backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border); font-size:13px; font-weight:500;
  }
  #topbar .tb-left{display:flex; align-items:center; gap:6px; color:var(--text-dim); cursor:pointer;}
  #topbar .tb-left:hover{color:var(--text);}
  #topbar .tb-center{position:absolute; left:50%; transform:translateX(-50%); font-weight:600; letter-spacing:.3px;}
  #topbar .tb-right{display:flex; align-items:center; gap:12px;}
  #topbar .tb-right svg{width:16px; height:16px; opacity:.9;}
  #topbar .tb-right{cursor:pointer;}

  #powerMenu{
    position:absolute; top:34px; right:10px; width:190px; background:var(--surface-solid);
    border:1px solid var(--border); border-radius:10px; padding:6px; z-index:900;
    box-shadow:0 12px 30px rgba(0,0,0,.5); display:none; flex-direction:column; gap:2px;
  }
  #powerMenu button{
    background:none; border:none; color:var(--text); text-align:left; padding:9px 10px;
    border-radius:7px; font-size:13px; font-family:inherit; cursor:pointer; display:flex; gap:8px; align-items:center;
  }
  #powerMenu button:hover{background:rgba(255,255,255,0.08);}

  /* ---------- Windows ---------- */
  .win{
    position:absolute; min-width:320px; min-height:220px; background:var(--surface);
    backdrop-filter:blur(22px) saturate(140%); border:1px solid var(--border); border-radius:12px;
    box-shadow:0 25px 60px rgba(0,0,0,.45); overflow:hidden; display:flex; flex-direction:column;
    animation:pop .18s ease;
  }
  @keyframes pop{from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);}}
  .win-titlebar{
    height:38px; flex:0 0 38px; background:rgba(10,20,38,0.65); display:flex; align-items:center;
    justify-content:space-between; padding:0 8px 0 12px; cursor:grab; border-bottom:1px solid var(--border);
  }
  .win-titlebar:active{cursor:grabbing;}
  .win-title{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--text);}
  .win-title svg{width:16px; height:16px;}
  .win-btns{display:flex; gap:6px;}
  .win-btns button{
    width:14px; height:14px; border-radius:50%; border:none; cursor:pointer; padding:0; position:relative;
  }
  .btn-min{background:#f5c245;}
  .btn-max{background:#5fca5f;}
  .btn-close{background:#f2564b;}
  .win-body{flex:1; overflow:auto; position:relative;}
  .win.maximized{border-radius:0 !important;}

  /* ---------- Dock ---------- */
  #dock{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%); z-index:600;
    display:flex; align-items:flex-end; gap:8px; padding:8px 12px; border-radius:18px;
    background:rgba(6,14,28,0.55); backdrop-filter:blur(18px); border:1px solid var(--border);
  }
  .dock-icon{
    width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative; transition:transform .15s ease, background .15s ease;
    background:rgba(255,255,255,0.04);
  }
  .dock-icon:hover{transform:translateY(-8px) scale(1.06); background:rgba(255,255,255,0.09);}
  .dock-icon svg{width:26px; height:26px;}
  .dock-icon .dot{
    position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); width:4px; height:4px;
    border-radius:50%; background:var(--accent); opacity:0; transition:opacity .15s;
  }
  .dock-icon.open .dot{opacity:1;}
  .dock-sep{width:1px; align-self:stretch; margin:4px 4px; background:var(--border);}

  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15); border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- Terminal ---------- */
  .term{background:#0a1220; height:100%; padding:12px 14px; font-family:'JetBrains Mono',monospace; font-size:13px; color:#c9e6ff; overflow-y:auto;}
  .term .line{white-space:pre-wrap; word-break:break-word; line-height:1.55;}
  .term .prompt-row{display:flex; gap:6px;}
  .term .ps{color:#60d38a; flex:0 0 auto;}
  .term .ps2{color:#60b3e4;}
  .term input{
    flex:1; background:none; border:none; outline:none; color:#eaf2fb; font-family:inherit; font-size:13px;
  }
  .term .ok{color:#60d38a;} .term .warn{color:#f5c245;} .term .err{color:#f2564b;} .term .dim{color:#7d92ad;}

  /* ---------- Notepad ---------- */
  .notepad{display:flex; flex-direction:column; height:100%;}
  .notepad-toolbar{
    display:flex; align-items:center; gap:8px; padding:8px 10px; background:rgba(255,255,255,0.03);
    border-bottom:1px solid var(--border); font-size:12px;
  }
  .notepad-toolbar input[type=text]{
    background:rgba(255,255,255,.06); border:1px solid var(--border); border-radius:6px; color:var(--text);
    padding:5px 8px; font-size:12px; font-family:inherit; width:150px;
  }
  .np-btn{
    background:rgba(255,255,255,.07); border:1px solid var(--border); color:var(--text); border-radius:6px;
    padding:5px 10px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .np-btn:hover{background:rgba(255,255,255,.13);}
  .notepad textarea{
    flex:1; resize:none; border:none; outline:none; background:transparent; color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:13.5px; line-height:1.6; padding:14px; width:100%;
  }
  .notepad-status{padding:4px 10px; font-size:11px; color:var(--text-dim); border-top:1px solid var(--border);}
  .toast{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:#182b46; border:1px solid var(--border); padding:7px 14px; border-radius:8px; font-size:12px;
    transition:all .25s ease; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- Gallery ---------- */
  .gallery{padding:14px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; height:100%; overflow-y:auto;}
  .gallery img{width:100%; height:110px; object-fit:cover; border-radius:8px; cursor:pointer; border:1px solid var(--border); transition:transform .15s;}
  .gallery img:hover{transform:scale(1.03); filter:brightness(1.1);}
  .lightbox{position:absolute; inset:0; background:rgba(2,6,14,.92); display:none; align-items:center; justify-content:center; flex-direction:column; z-index:20;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:82%; max-height:70%; border-radius:10px; box-shadow:0 20px 50px rgba(0,0,0,.6);}
  .lightbox .lb-controls{display:flex; gap:14px; margin-top:14px;}
  .lightbox button{background:rgba(255,255,255,.1); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 14px; cursor:pointer; font-family:inherit;}
  .lightbox button:hover{background:rgba(255,255,255,.2);}

  /* ---------- Flappy Bird ---------- */
  .flappy-wrap{display:flex; align-items:center; justify-content:center; height:100%; background:#0a1220;}
  #flappyCanvas{border-radius:8px; display:block;}

  .welcome-hint{position:absolute; bottom:16px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--text-dim); z-index:50; pointer-events:none;}
</style>
</head>
<body>
<div id="desktop">

  <!-- Background -->
  <div id="bgLayer">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
    <div class="moon"></div>
    <div id="stars"></div>
    <div class="mountains">
      <svg class="m-back" viewBox="0 0 1440 260" preserveAspectRatio="none"><path fill="#13294f" d="M0,180 L120,120 L240,170 L380,90 L520,160 L660,110 L800,175 L960,100 L1120,165 L1280,120 L1440,175 L1440,260 L0,260 Z"/></svg>
      <svg class="m-mid" viewBox="0 0 1440 220" preserveAspectRatio="none"><path fill="#1c3a63" d="M0,160 L160,100 L300,150 L460,80 L620,140 L780,95 L940,150 L1100,90 L1260,145 L1440,110 L1440,220 L0,220 Z"/></svg>
      <svg class="m-front" viewBox="0 0 1440 170" preserveAspectRatio="none"><path fill="#233f6b" d="M0,130 L140,70 L320,120 L480,60 L640,115 L820,55 L1000,120 L1180,65 L1440,120 L1440,170 L0,170 Z"/></svg>
    </div>
  </div>

  <!-- Top bar -->
  <div id="topbar">
    <div class="tb-left" id="activitiesBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
      Etkinlikler
    </div>
    <div class="tb-center" id="clock">--:--</div>
    <div class="tb-right">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 10v4"/></svg>
      <div id="powerBtn" style="display:flex;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v8"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
      </div>
    </div>
    <div id="powerMenu">
      <button id="lockBtn">🔒 Kilitle</button>
      <button id="restartBtn">🔁 Yeniden Başlat</button>
      <button id="shutdownBtn">⏻ Kapat</button>
    </div>
  </div>

  <!-- Windows render here -->
  <div id="windows"></div>

  <!-- Shutdown overlay -->
  <div id="shutdownOverlay" style="display:none; position:absolute; inset:0; background:#000; z-index:2000; align-items:center; justify-content:center; flex-direction:column; gap:14px;">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#60b3e4" stroke-width="2"><path d="M12 2v8"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
    <div id="shutdownText" style="font-size:13px; color:#9fb3cc; letter-spacing:.5px;">Fedora kapatılıyor…</div>
  </div>

  <!-- Dock -->
  <div id="dock">
    <div class="dock-icon" data-app="terminal" title="Terminal">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c9e6ff" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m6 9 4 3-4 3"/><path d="M13 15h5"/></svg>
      <div class="dot"></div>
    </div>
    <div class="dock-icon" data-app="notepad" title="Not Defteri">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffd479" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
      <div class="dot"></div>
    </div>
    <div class="dock-icon" data-app="gallery" title="Resimler">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8fd3ff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="m21 15-5-5L5 21"/></svg>
      <div class="dot"></div>
    </div>
    <div class="dock-icon" data-app="flappy" title="Flappy Bird">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7bd97b" stroke-width="2"><path d="M22 12c-3 0-4-3-7-3s-4 2-6 2-3-1-5-1"/><circle cx="17" cy="8" r="2.4"/><path d="M4 15c3 1 6-2 9-1"/></svg>
      <div class="dot"></div>
    </div>
    <div class="dock-sep"></div>
    <div class="dock-icon" data-app="about" title="Fedora Hakkında">
      <svg viewBox="0 0 24 24" fill="none" stroke="#60b3e4" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
      <div class="dot"></div>
    </div>
  </div>

  <div class="welcome-hint" id="hint">dock'tan bir uygulama seç ✨</div>
</div>

<script>
/* ================= Background particles ================= */
const starsEl = document.getElementById('stars');
for(let i=0;i<140;i++){
  const s=document.createElement('div');
  s.className='star';
  const size=Math.random()*2+0.6;
  s.style.width=s.style.height=size+'px';
  s.style.top=(Math.random()*70)+'%';
  s.style.left=(Math.random()*100)+'%';
  s.style.animationDuration=(2+Math.random()*4)+'s';
  s.style.animationDelay=(Math.random()*4)+'s';
  starsEl.appendChild(s);
}

/* subtle parallax with mouse */
document.addEventListener('mousemove', e=>{
  const x=(e.clientX/window.innerWidth-0.5);
  const y=(e.clientY/window.innerHeight-0.5);
  document.querySelectorAll('.aurora').forEach((a,i)=>{
    a.style.marginLeft=(x*20*(i+1))+'px';
    a.style.marginTop=(y*14*(i+1))+'px';
  });
});

/* ================= Clock ================= */
function tick(){
  const d=new Date();
  const days=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
  const hh=String(d.getHours()).padStart(2,'0');
  const mm=String(d.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = `${days[d.getDay()]} ${d.getDate()}  ${hh}:${mm}`;
}
tick(); setInterval(tick,1000*10);

/* ================= Power menu ================= */
const powerBtn=document.getElementById('powerBtn');
const powerMenu=document.getElementById('powerMenu');
powerBtn.addEventListener('click', e=>{
  e.stopPropagation();
  powerMenu.style.display = powerMenu.style.display==='flex' ? 'none':'flex';
});
document.addEventListener('click', ()=> powerMenu.style.display='none');

function fakeShutdown(text, restart){
  const ov=document.getElementById('shutdownOverlay');
  const t=document.getElementById('shutdownText');
  t.textContent=text;
  ov.style.display='flex';
  setTimeout(()=>{
    if(restart){
      t.textContent='Fedora başlatılıyor…';
      setTimeout(()=>{ ov.style.display='none'; }, 1400);
    }
  }, 1600);
}
document.getElementById('shutdownBtn').addEventListener('click', ()=>fakeShutdown('Fedora kapatılıyor…', false));
document.getElementById('restartBtn').addEventListener('click', ()=>fakeShutdown('Fedora yeniden başlatılıyor…', true));
document.getElementById('lockBtn').addEventListener('click', ()=>{
  fakeShutdown('Ekran kilitlendi 🔒', true);
});

/* ================= Window Manager ================= */
let zTop=100;
const winsContainer=document.getElementById('windows');
const openApps={};

function bringToFront(win){
  zTop++; win.style.zIndex=zTop;
}

function createWindow({id, title, iconSVG, width=520, height=380, x, y, contentEl}){
  if(openApps[id]){
    bringToFront(openApps[id].el);
    return openApps[id];
  }
  const el=document.createElement('div');
  el.className='win';
  const winW = width, winH = height;
  const posX = x ?? (60 + Object.keys(openApps).length*30);
  const posY = y ?? (55 + Object.keys(openApps).length*26);
  el.style.width=winW+'px';
  el.style.height=winH+'px';
  el.style.left=posX+'px';
  el.style.top=posY+'px';

  el.innerHTML = `
    <div class="win-titlebar">
      <div class="win-title">${iconSVG}<span>${title}</span></div>
      <div class="win-btns">
        <button class="btn-min" title="Simge durumuna küçült"></button>
        <button class="btn-max" title="Büyüt/Küçült"></button>
        <button class="btn-close" title="Kapat"></button>
      </div>
    </div>
    <div class="win-body"></div>
  `;
  el.querySelector('.win-body').appendChild(contentEl);
  winsContainer.appendChild(el);
  bringToFront(el);

  // drag
  const bar=el.querySelector('.win-titlebar');
  let dragging=false, offX=0, offY=0;
  bar.addEventListener('mousedown', e=>{
    if(e.target.tagName==='BUTTON') return;
    dragging=true; offX=e.clientX-el.offsetLeft; offY=e.clientY-el.offsetTop;
    bringToFront(el);
  });
  document.addEventListener('mousemove', e=>{
    if(!dragging) return;
    el.style.left=Math.max(0, e.clientX-offX)+'px';
    el.style.top=Math.max(34, e.clientY-offY)+'px';
  });
  document.addEventListener('mouseup', ()=> dragging=false);
  el.addEventListener('mousedown', ()=> bringToFront(el));

  // buttons
  el.querySelector('.btn-close').addEventListener('click', ()=>{
    el.remove();
    delete openApps[id];
    document.querySelector(`.dock-icon[data-app="${id}"]`)?.classList.remove('open');
  });
  el.querySelector('.btn-min').addEventListener('click', ()=>{
    el.style.display='none';
  });
  let maximized=false, prevRect=null;
  el.querySelector('.btn-max').addEventListener('click', ()=>{
    if(!maximized){
      prevRect={left:el.style.left, top:el.style.top, width:el.style.width, height:el.style.height};
      el.style.left='0px'; el.style.top='34px';
      el.style.width='100vw'; el.style.height='calc(100vh - 34px)';
      el.classList.add('maximized');
    } else {
      Object.assign(el.style, prevRect);
      el.classList.remove('maximized');
    }
    maximized=!maximized;
  });

  openApps[id]={el};
  document.querySelector(`.dock-icon[data-app="${id}"]`)?.classList.add('open');
  document.getElementById('hint').style.display='none';
  return openApps[id];
}

/* dock clicks */
document.querySelectorAll('.dock-icon').forEach(icon=>{
  icon.addEventListener('click', ()=>{
    const app=icon.dataset.app;
    if(openApps[app]){
      openApps[app].el.style.display='block';
      bringToFront(openApps[app].el);
      return;
    }
    launchApp(app);
  });
});

function launchApp(app){
  if(app==='terminal') openTerminal();
  else if(app==='notepad') openNotepad();
  else if(app==='gallery') openGallery();
  else if(app==='flappy') openFlappy();
  else if(app==='about') openAbout();
}

const icons={
  terminal:`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#c9e6ff" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m6 9 4 3-4 3"/><path d="M13 15h5"/></svg>`,
  notepad:`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ffd479" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>`,
  gallery:`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#8fd3ff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="m21 15-5-5L5 21"/></svg>`,
  flappy:`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#7bd97b" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>`,
  about:`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#60b3e4" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>`
};

/* ================= Terminal App ================= */
function openTerminal(){
  const body=document.createElement('div');
  body.className='term';
  body.innerHTML = `<div class="line dim">Fedora Linux 41 (Workstation Edition) — kanka'nın terminali</div>
<div class="line dim">'help' yaz, komutları gör.</div>`;

  const fakeFS = ['Belgeler','İndirilenler','Müzik','Projeler','robot_rbot.stl','rbot_os_kernel.c','notlar.txt'];
  let history=[]; let hIndex=-1;

  function makePromptRow(){
    const row=document.createElement('div');
    row.className='prompt-row';
    row.innerHTML = `<span class="ps">deniz@fedora</span><span class="ps2">:~$</span>`;
    const input=document.createElement('input');
    input.autofocus=true;
    row.appendChild(input);
    body.appendChild(row);
    body.scrollTop=body.scrollHeight;
    input.focus();

    input.addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        const cmd=input.value.trim();
        input.disabled=true;
        printLine(`deniz@fedora:~$ ${cmd}`, 'dim');
        if(cmd) { history.push(cmd); hIndex=history.length; }
        runCommand(cmd);
      } else if(e.key==='ArrowUp'){
        if(hIndex>0){ hIndex--; input.value=history[hIndex]; }
        e.preventDefault();
      } else if(e.key==='ArrowDown'){
        if(hIndex<history.length-1){ hIndex++; input.value=history[hIndex]; } else { hIndex=history.length; input.value=''; }
        e.preventDefault();
      }
    });
  }

  function printLine(text, cls=''){
    const d=document.createElement('div');
    d.className='line '+cls;
    d.textContent=text;
    body.appendChild(d);
    body.scrollTop=body.scrollHeight;
  }
  function printHTML(html){
    const d=document.createElement('div');
    d.className='line';
    d.innerHTML=html;
    body.appendChild(d);
    body.scrollTop=body.scrollHeight;
  }

  function runCommand(cmd){
    const [c, ...args]=cmd.split(' ');
    switch(c){
      case '':
        break;
      case 'help':
        printLine(`Komutlar: help, neofetch, ls, echo [metin], date, whoami, clear, rbot, uname -a, cowsay [metin]`, 'ok');
        break;
      case 'ls':
        printLine(fakeFS.join('   '));
        break;
      case 'whoami':
        printLine('deniz — elektronik & donanım meraklısı 🛠️');
        break;
      case 'date':
        printLine(new Date().toString());
        break;
      case 'uname':
        printLine('Linux fedora-wes 6.11.4-301.fc41.x86_64 GNU/Linux');
        break;
      case 'echo':
        printLine(args.join(' '));
        break;
      case 'rbot':
        printLine('Rb-0t OS v0.4 çalışıyor — VBE framebuffer masaüstü aktif. 🤖', 'ok');
        break;
      case 'cowsay':
        const msg = args.join(' ') || 'moo';
        printHTML(`<pre style="margin:0">
 ${'_'.repeat(msg.length+2)}
&lt; ${msg} &gt;
 ${'-'.repeat(msg.length+2)}
        \\   ^__^
         \\  (oo)\\_______
            (__)\\       )\\/\\
                ||----w |
                ||     ||</pre>`);
        break;
      case 'neofetch':
        printHTML(`<div style="display:flex; gap:16px;">
<pre style="color:#3c6eb4; margin:0; line-height:1.15;">      _____
     /   __)\\
     |  /  \\/
  ___| |______
 / (_____)   \\
 \\____)      /
      \\_____/</pre>
<div>
<b style="color:#60b3e4">deniz@fedora-wes</b>
-----------------
<b>OS:</b> Fedora Linux 41 (WES Edition)
<b>Host:</b> Rb-0t / LattePanda V1
<b>Kernel:</b> 6.11.4-301.fc41
<b>Shell:</b> bash 5.2
<b>DE:</b> GNOME-benzeri (WES)
<b>Terminal:</b> wes-term
<b>CPU:</b> Değişken (tinkering modu)
</div></div>`);
        break;
      case 'clear':
        body.innerHTML='';
        makePromptRow();
        return;
      default:
        printLine(`bash: ${c}: komut bulunamadı`, 'err');
    }
    makePromptRow();
  }

  makePromptRow();
  createWindow({id:'terminal', title:'Terminal', iconSVG:icons.terminal, width:560, height:400, contentEl:body});
}

/* ================= Notepad App ================= */
function openNotepad(){
  const wrap=document.createElement('div');
  wrap.className='notepad';
  wrap.innerHTML=`
    <div class="notepad-toolbar">
      <input type="text" id="npName" value="notlarim.txt">
      <button class="np-btn" id="npNew">Yeni</button>
      <button class="np-btn" id="npSave">Kaydet</button>
      <button class="np-btn" id="npDownload">İndir (.txt)</button>
    </div>
    <textarea id="npArea" placeholder="Buraya yaz kanka...">Rb-0t projesi yapılacaklar:
- Servo kalibrasyonu
- PCA9685 test
- LattePanda üzerinde OS kurulumu
</textarea>
    <div class="notepad-status" id="npStatus">Kaydedilmedi</div>
    <div class="toast" id="npToast">Kaydedildi ✓</div>
  `;
  createWindow({id:'notepad', title:'Not Defteri', iconSVG:icons.notepad, width:480, height:420, contentEl:wrap});

  const area=wrap.querySelector('#npArea');
  const status=wrap.querySelector('#npStatus');
  const toast=wrap.querySelector('#npToast');

  function updateStatus(){
    status.textContent = `${area.value.length} karakter · ${area.value.split(/\s+/).filter(Boolean).length} kelime`;
  }
  area.addEventListener('input', updateStatus);
  updateStatus();

  wrap.querySelector('#npNew').addEventListener('click', ()=>{
    if(area.value && !confirm('Yeni dosya açılsın mı? Kaydedilmemiş değişiklikler silinir.')) return;
    area.value=''; updateStatus();
  });
  wrap.querySelector('#npSave').addEventListener('click', ()=>{
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 1400);
  });
  wrap.querySelector('#npDownload').addEventListener('click', ()=>{
    const name=wrap.querySelector('#npName').value || 'notlarim.txt';
    const blob=new Blob([area.value], {type:'text/plain'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=name.endsWith('.txt')?name:name+'.txt';
    a.click();
  });
}

/* ================= Gallery App ================= */
function openGallery(){
  const wrap=document.createElement('div');
  wrap.style.height='100%';
  wrap.style.position='relative';

  const ids=[1015,1025,1035,1043,1051,1062,1074,1084,1011,237,244,1049];
  const urls = ids.map(id=>`https://picsum.photos/id/${id}/700/500`);

  const grid=document.createElement('div');
  grid.className='gallery';
  urls.forEach((u,i)=>{
    const img=document.createElement('img');
    img.src=u; img.loading='lazy';
    img.addEventListener('click', ()=> showLightbox(i));
    grid.appendChild(img);
  });
  wrap.appendChild(grid);

  const lb=document.createElement('div');
  lb.className='lightbox';
  lb.innerHTML=`<img id="lbImg" src=""><div class="lb-controls">
    <button id="lbPrev">‹ Önceki</button>
    <button id="lbClose">Kapat</button>
    <button id="lbNext">Sonraki ›</button>
  </div>`;
  wrap.appendChild(lb);

  let cur=0;
  function showLightbox(i){
    cur=i;
    lb.querySelector('#lbImg').src=urls[cur];
    lb.classList.add('show');
  }
  lb.querySelector('#lbClose').addEventListener('click', ()=>lb.classList.remove('show'));
  lb.querySelector('#lbPrev').addEventListener('click', ()=>{ cur=(cur-1+urls.length)%urls.length; lb.querySelector('#lbImg').src=urls[cur]; });
  lb.querySelector('#lbNext').addEventListener('click', ()=>{ cur=(cur+1)%urls.length; lb.querySelector('#lbImg').src=urls[cur]; });

  createWindow({id:'gallery', title:'Resimler', iconSVG:icons.gallery, width:600, height:440, contentEl:wrap});
}

/* ================= Flappy Bird App ================= */
function openFlappy(){
  const wrap=document.createElement('div');
  wrap.className='flappy-wrap';
  const canvas=document.createElement('canvas');
  canvas.id='flappyCanvas';
  canvas.width=340; canvas.height=460;
  wrap.appendChild(canvas);
  createWindow({id:'flappy', title:'Flappy Bird', iconSVG:icons.flappy, width:360, height:500, contentEl:wrap});

  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  let bird, pipes, frame, score, best=Number(sessionStorage.getItem?0:0)||0, state;
  best = window.__flappyBest || 0;

  function reset(){
    bird={x:70, y:H/2, vy:0, r:12};
    pipes=[];
    frame=0; score=0;
    state='ready';
  }
  reset();

  function spawnPipe(){
    const gap=125;
    const top=40+Math.random()*(H-gap-150);
    pipes.push({x:W, top, gap, w:46, passed:false});
  }

  function drawBg(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0e2140'); g.addColorStop(1,'#1c3a63');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // stars
    ctx.fillStyle='rgba(255,255,255,.5)';
    for(let i=0;i<20;i++){
      const sx=(i*53 + frame*0.3)%W;
      const sy=(i*37)%150+10;
      ctx.fillRect(sx,sy,1.6,1.6);
    }
  }

  function drawBird(){
    ctx.save();
    ctx.translate(bird.x, bird.y);
    const angle=Math.max(-0.5, Math.min(0.9, bird.vy/10));
    ctx.rotate(angle);
    ctx.fillStyle='#ffd479';
    ctx.beginPath(); ctx.arc(0,0,bird.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#e88b2d';
    ctx.beginPath(); ctx.moveTo(bird.r-2,0); ctx.lineTo(bird.r+8,-4); ctx.lineTo(bird.r+8,4); ctx.fill();
    ctx.fillStyle='#182b46';
    ctx.beginPath(); ctx.arc(4,-4,2,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawPipes(){
    ctx.fillStyle='#60b3e4';
    pipes.forEach(p=>{
      ctx.fillRect(p.x, 0, p.w, p.top);
      ctx.fillRect(p.x, p.top+p.gap, p.w, H-(p.top+p.gap));
      ctx.fillStyle='#8fd3ff';
      ctx.fillRect(p.x-3, p.top-14, p.w+6, 14);
      ctx.fillRect(p.x-3, p.top+p.gap, p.w+6, 14);
      ctx.fillStyle='#60b3e4';
    });
  }

  function drawScore(){
    ctx.fillStyle='#eaf2fb';
    ctx.font='bold 22px Inter, sans-serif';
    ctx.textAlign='center';
    ctx.fillText(score, W/2, 44);
  }

  function drawCenterText(lines){
    ctx.fillStyle='rgba(4,10,20,.55)';
    ctx.fillRect(0,H/2-56,W,112);
    ctx.fillStyle='#eaf2fb';
    ctx.textAlign='center';
    ctx.font='bold 16px Inter, sans-serif';
    ctx.fillText(lines[0], W/2, H/2-14);
    ctx.font='12px Inter, sans-serif';
    ctx.fillStyle='#9fb3cc';
    ctx.fillText(lines[1], W/2, H/2+10);
    if(lines[2]) ctx.fillText(lines[2], W/2, H/2+30);
  }

  function flap(){
    if(state==='ready'){ state='playing'; }
    if(state==='playing'){ bird.vy=-6.4; }
    if(state==='over'){ reset(); state='playing'; }
  }
  canvas.addEventListener('mousedown', flap);
  window.addEventListener('keydown', e=>{
    if(e.code==='Space' && openApps['flappy']){ e.preventDefault(); flap(); }
  });

  function loop(){
    frame++;
    drawBg();

    if(state==='playing'){
      bird.vy += 0.35;
      bird.y += bird.vy;

      if(frame%92===0) spawnPipe();
      pipes.forEach(p=> p.x -= 2.4);
      pipes = pipes.filter(p=> p.x > -p.w-5);

      pipes.forEach(p=>{
        if(!p.passed && p.x+p.w < bird.x){ p.passed=true; score++; }
        const hitX = bird.x+bird.r > p.x && bird.x-bird.r < p.x+p.w;
        const hitY = bird.y-bird.r < p.top || bird.y+bird.r > p.top+p.gap;
        if(hitX && hitY) state='over';
      });
      if(bird.y+bird.r>H || bird.y-bird.r<0) state='over';
      if(state==='over') best=Math.max(best, score);
    }

    drawPipes();
    drawBird();
    drawScore();

    if(state==='ready') drawCenterText(['Flappy Bird 🐦', 'Başlamak için tıkla / boşluğa bas', `En iyi: ${best}`]);
    if(state==='over') drawCenterText([`Skor: ${score}`, 'Tekrar denemek için tıkla', `En iyi: ${best}`]);

    requestAnimationFrame(loop);
  }
  loop();
}

document.getElementById('activitiesBtn').addEventListener('click', ()=>{
  Object.values(openApps).forEach(a=> a.el.style.display='block');
  if(Object.keys(openApps).length===0){
    openAbout();
  }
});
